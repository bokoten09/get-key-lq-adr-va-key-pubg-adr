<script>
// --- QUẢN LÝ LƯỢT GET KEY THEO NGÀY (LƯU TRONG BROWSER STORAGE) ---
function checkAndUpdateLimit(gameKey) {
    let today = new Date().toISOString().slice(0, 10);
    let storageData = JSON.parse(localStorage.getItem('key_limits') || '{}');

    if (storageData.date !== today) {
        storageData = { date: today, lienquan: 5, pubg: 5 };
    }

    return storageData[gameKey];
}

function decreaseLimit(gameKey) {
    let today = new Date().toISOString().slice(0, 10);
    let storageData = JSON.parse(localStorage.getItem('key_limits') || '{}');
    if (storageData.date !== today) {
        storageData = { date: today, lienquan: 5, pubg: 5 };
    }
    if (storageData[gameKey] > 0) {
        storageData[gameKey] -= 1;
    }
    localStorage.setItem('key_limits', JSON.stringify(storageData));
    updateUI();
}

function updateUI() {
    ['lq', 'pubg'].forEach(prefix => {
        let gameKey = (prefix === 'lq') ? 'lienquan' : 'pubg';
        let remaining = checkAndUpdateLimit(gameKey);
        
        document.getElementById(`text-limit-${prefix}`).innerText = `${remaining} / 5 lượt`;
        let percent = (remaining / 5) * 100;
        document.getElementById(`progress-${prefix}`).style.width = `${percent}%`;

        if (remaining <= 0) {
            let btn = document.getElementById(`btn-${prefix}`);
            btn.innerText = "ĐÃ HẾT LƯỢT HÔM NAY";
            btn.disabled = true;
            btn.style.background = "#ccc";
        }
    });
}

updateUI();

// --- XỬ LÝ TẠO LINK & GỌI API TRAFFICSO1 ---
async function createLink(gameType, prefix, gameDisplayName) {
    let gameKey = (prefix === 'lq') ? 'lienquan' : 'pubg';
    let remaining = checkAndUpdateLimit(gameKey);

    if (remaining <= 0) {
        alert("Bạn đã hết 5 lượt get key cho game này trong ngày hôm nay!");
        return;
    }

    const btn = document.getElementById(`btn-${prefix}`);
    let oldText = btn.innerText;
    btn.innerText = "Đang xử lý...";
    btn.disabled = true;

    try {
        // 1. Gọi API gốc chuẩn qua AJAX của ông bạn
        let formData = new FormData();
        formData.append('type', gameType);

        let responseFromFriend = await fetch('https://getkeymafia.online/ajax/create_shorterlink.php', {
            method: 'POST',
            body: formData
        });
        
        let friendData = await responseFromFriend.json();
        let originalLink = friendData.link; // Link gốc nhận được

        // 2. Gọi API rút gọn của bạn (Trafficso1)
        let apiKey = "dab50e1a937742498aebd160bd7c13d5"; // API Key của bạn[cite: 4]
        let apiUrl = `https://manager.trafficso1.com/api/cong-khai/tao-lien-ket?apikey=${apiKey}&url=${encodeURIComponent(originalLink)}`;[cite: 4]

        let trafficRes = await fetch(apiUrl);
        let trafficData = await trafficRes.json();
        
        let domainRutGon = "https://trafficso1.com/"; // Domain rút gọn của bạn
        let myShortLink = domainRutGon + trafficData.id;

        // Trừ 1 lượt sau khi tạo link thành công
        decreaseLimit(gameKey);

        // 3. Hiển thị Popup Modal thành công
        document.getElementById('modal-game-name').innerText = gameDisplayName;
        document.getElementById('final-link-input').value = myShortLink;
        document.getElementById('btn-open-link').href = myShortLink;
        document.getElementById('successModal').classList.remove('hidden');

    } catch (error) {
        alert("Có lỗi kết nối hệ thống, vui lòng thử lại!");
        console.error(error);
        btn.innerText = oldText;
        btn.disabled = false;
    }
}

// Chức năng copy link trong popup
function copyLink() {
    let inputElem = document.getElementById('final-link-input');
    inputElem.select();
    inputElem.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(inputElem.value);
    alert("Đã sao chép liên kết thành công!");
}

// Đóng modal và làm mới trang (quay về trang chủ)
function closeModalAndRefresh() {
    document.getElementById('successModal').classList.add('hidden');
    window.location.href = "https://bokoten09.github.io/get-key-lq-adr-va-key-pubg-adr/"; 
}
</script>
